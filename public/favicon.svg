<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- EcoLoop / Circular Decarbonization Gradient -->
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2BA"/>
      <stop offset="60%" stop-color="#00B8A9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00B8A9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Glowing Circular Decarbonization Loop & Leaf Motif -->
  <g filter="url(#glow)">
    <!-- Top Arc Arrow -->
    <path
      d="M32 14 C41.94 14 50 22.06 50 32 C50 35.8 48.8 39.3 46.8 42.2"
      stroke="url(#ecoGrad)"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- Bottom Arc Arrow with Return Flow -->
    <path
      d="M32 50 C22.06 50 14 41.94 14 32 C14 28.2 15.2 24.7 17.2 21.8"
      stroke="url(#ecoGrad)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Arrowhead Top -->
    <path
      d="M45 44 L48.5 41.5 L44 38.5"
      fill="none"
      stroke="#10B981"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Arrowhead Bottom -->
    <path
      d="M19 20 L15.5 22.5 L20 25.5"
      fill="none"
      stroke="#00D2BA"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Center Eco Core / Decarbonization Spark -->
    <circle cx="32" cy="32" r="5" fill="url(#ecoGrad)" />
  </g>
</svg>